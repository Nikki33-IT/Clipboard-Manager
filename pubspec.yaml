name: clipvault
description: Lokalny menedzer historii schowka (Windows desktop).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.3.1
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
